<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Dashboard</title>

  <!-- Theme script runs before paint to prevent flash -->
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="header-brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Life Dashboard</span>
    </div>
    <button type="button" id="theme-toggle" class="btn btn-icon" aria-label="Toggle dark mode" title="Toggle dark mode">
      <span id="theme-icon">🌙</span>
    </button>
  </header>

  <!-- ===== MAIN GRID ===== -->
  <main class="dashboard-grid">

    <!-- ─── GREETING WIDGET ─── -->
    <section class="widget widget--greeting" aria-label="Greeting">
      <div class="greeting-time" id="greeting-time">00:00:00</div>
      <div class="greeting-date" id="greeting-date">—</div>
      <div class="greeting-text">
        <span id="greeting-phrase">Good Morning</span>,&nbsp;
        <span id="greeting-name" class="greeting-name">Friend</span>
        <button type="button" class="btn btn-ghost btn-sm" id="edit-name-btn" aria-label="Edit your name">✏️</button>
      </div>
      <!-- Inline name editor (hidden by default) -->
      <div class="name-editor hidden" id="name-editor">
        <input
          type="text"
          id="name-input"
          class="input"
          placeholder="Enter your name…"
          maxlength="30"
          aria-label="Your name"
        >
        <button type="button" class="btn btn-accent btn-sm" id="save-name-btn">Save</button>
        <button type="button" class="btn btn-ghost btn-sm" id="cancel-name-btn">Cancel</button>
      </div>
    </section>

    <!-- ─── FOCUS TIMER WIDGET ─── -->
    <section class="widget widget--timer" aria-label="Focus Timer">
      <h2 class="widget-title">🍅 Focus Timer</h2>
      <div class="timer-display" id="timer-display" aria-live="polite">25:00</div>
      <div class="timer-controls">
        <button type="button" class="btn btn-accent" id="timer-start">Start</button>
        <button type="button" class="btn btn-outline" id="timer-stop">Stop</button>
        <button type="button" class="btn btn-outline" id="timer-reset">Reset</button>
      </div>
      <div class="timer-custom">
        <label for="pomo-duration" class="label">Custom minutes:</label>
        <input
          type="number"
          id="pomo-duration"
          class="input input--sm"
          min="1"
          max="120"
          value="25"
          aria-label="Custom Pomodoro duration in minutes"
        >
        <button type="button" class="btn btn-ghost btn-sm" id="pomo-set">Set</button>
      </div>
    </section>

    <!-- ─── TO-DO LIST WIDGET ─── -->
    <section class="widget widget--todo" aria-label="To-Do List">
      <h2 class="widget-title">📋 To-Do List</h2>

      <!-- Add task form -->
      <div class="todo-form">
        <input
          type="text"
          id="task-input"
          class="input"
          placeholder="Add a new task…"
          aria-label="New task text"
          maxlength="100"
        >
        <button type="button" class="btn btn-accent" id="add-task-btn">Add</button>
      </div>
      <p class="todo-error hidden" id="todo-error" role="alert"></p>

      <!-- Sort toolbar -->
      <div class="sort-toolbar" role="group" aria-label="Sort tasks">
        <span class="sort-label">Sort:</span>
        <button type="button" class="btn btn-sort active" data-sort="newest">Newest</button>
        <button type="button" class="btn btn-sort" data-sort="oldest">Oldest</button>
        <button type="button" class="btn btn-sort" data-sort="az">A→Z</button>
        <button type="button" class="btn btn-sort" data-sort="za">Z→A</button>
        <button type="button" class="btn btn-sort" data-sort="donelast">Done Last</button>
      </div>

      <!-- Task list -->
      <ul class="task-list" id="task-list" aria-label="Task list">
        <!-- Tasks rendered by JS -->
      </ul>
      <p class="empty-state hidden" id="todo-empty">No tasks yet. Add one above! 🎉</p>
    </section>

    <!-- ─── QUICK LINKS WIDGET ─── -->
    <section class="widget widget--links" aria-label="Quick Links">
      <h2 class="widget-title">🔗 Quick Links</h2>

      <!-- Add link form -->
      <div class="links-form">
        <input
          type="text"
          id="link-name-input"
          class="input"
          placeholder="Name (e.g. GitHub)"
          aria-label="Link name"
          maxlength="30"
        >
        <input
          type="text"
          id="link-url-input"
          class="input"
          placeholder="URL (e.g. github.com)"
          aria-label="Link URL"
          maxlength="200"
        >
        <button type="button" class="btn btn-accent" id="add-link-btn">Add Link</button>
      </div>
      <p class="links-error hidden" id="links-error" role="alert"></p>

      <!-- Links container -->
      <div class="links-container" id="links-container">
        <a href="https://github.com/mfauzanhanif/mfauzanhanif-CodingCamp-12Octobert26-fauzanhanif/" target="_blank" rel="noopener noreferrer" class="link-item" aria-label="Open Github (https://github.com/mfauzanhanif/mfauzanhanif-CodingCamp-12Octobert26-fauzanhanif/)">Github</a>
        <a href="https://mfauzanhanif.github.io/mfauzanhanif-CodingCamp-12Octobert26-fauzanhanif/" target="_blank" rel="noopener noreferrer" class="link-item" aria-label="Open Github Page (https://mfauzanhanif.github.io/mfauzanhanif-CodingCamp-12Octobert26-fauzanhanif/)">Github Page</a>
      </div>
      <p class="empty-state hidden" id="links-empty">No links yet. Add your favorites! 🌐</p>
    </section>

  </main>

  <footer class="site-footer">
    <p>Built with ❤️ — Life Dashboard &copy; 2026</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
